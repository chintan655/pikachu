<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main">

        <div class="left">
            <img class="logo" src="pokemon-logo.png" alt="pokemon">

            <div class="content">
                <h5>POKEMON GEN I</h5>
                <h1>Pikachu</h1>

                <p>
                    Pikachu is an Electric-type Pokémon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pokémon.
                    They are almost completely covered by
                    yellow fur.
                </p>

                <div class="count">
                    <span class="line"></span>
                    <h4>01 / 08</h4>
                </div>
            </div>

            <div class="circle"></div>
        </div>

        <div class="right">
            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <img class="pikachu" src="pikachu.png" alt="pikachu">

            <div class="dots">
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

    </div>

</body>
</html>
